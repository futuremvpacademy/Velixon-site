name: Security verification

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "19 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install locked site dependencies
        run: npm ci

      - name: Install locked video dependencies
        run: npm ci --prefix velixon-video

      - name: Run security and production verification
        run: npm run verify:security

      - name: Scan complete repository history for credentials
        run: npm run audit:secret-history
