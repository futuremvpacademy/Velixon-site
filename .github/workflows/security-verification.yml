name: Security verification

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "19 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install locked site dependencies
        run: npm ci

      - name: Install locked video dependencies
        run: npm ci --prefix velixon-video

      - name: Run security and production verification
        run: npm run verify:security

      - name: Scan complete repository history for credentials
        run: npm run audit:secret-history
