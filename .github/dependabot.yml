version: 2

updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/velixon-video"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "13:30"
      timezone: "America/Denver"
    open-pull-requests-limit: 5
