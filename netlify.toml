[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  ASTRO_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "22"

[[redirects]]
  from = "https://www.velixon.net/*"
  to = "https://velixon.net/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 200
  force = true

[[redirects]]
  from = "/services/ai-systems"
  to = "/services/ai-automation/"
  status = 301
  force = true

[[redirects]]
  from = "/services/ai-systems/"
  to = "/services/ai-automation/"
  status = 301
  force = true

[[redirects]]
  from = "/services/ai-systems/*"
  to = "/services/ai-automation/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/services/automation-integrations"
  to = "/services/workflow-automation/"
  status = 301
  force = true

[[redirects]]
  from = "/services/automation-integrations/"
  to = "/services/workflow-automation/"
  status = 301
  force = true

[[redirects]]
  from = "/services/automation-integrations/*"
  to = "/services/workflow-automation/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/engagements"
  to = "/pricing/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com; font-src 'self' data:; form-action 'self'; frame-ancestors 'self'; frame-src 'none'; img-src 'self' data: https:; manifest-src 'self'; media-src 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-DNS-Prefetch-Control = "off"
    X-Frame-Options = "SAMEORIGIN"
    X-Permitted-Cross-Domain-Policies = "none"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/sitemap-index.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/sitemap-*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/image-sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/review/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
